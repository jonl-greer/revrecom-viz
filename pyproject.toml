[project]
name = "revrecom"
version = "0.1.0"
description = "Reversible ReCom on a 4x4 grid: exact enumeration, chain, and visualisation data"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]
anim = ["manim"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["revrecom"]
